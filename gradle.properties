org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# v2.0 — quieter KMP configuration
kotlin.mpp.androidSourceSetLayoutVersion=2

# v2.0 — the source-set graph is declared explicitly in shared/build.gradle.kts (jvmMain/jvmTest
# intermediate sets shared by Android + desktop), so the default template is not used.
kotlin.mpp.applyDefaultHierarchyTemplate=false
compose.desktop.packaging.checkJdkVendor=false
