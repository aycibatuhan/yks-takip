[versions]
# Toolchain verified 2026-08-29: AGP 9.x requires Gradle 9.x (wrapper: 9.7.1) + JDK 17.
agp = "9.3.2"
kotlin = "2.3.21"
ksp = "2.3.11"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
composeBom = "2026.08.00"
adaptive = "1.3.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
room = "2.8.4"
datastore = "1.2.1"
serializationJson = "1.11.0"
coreKtx = "1.19.0"
junit = "4.13.2"
coroutinesTest = "1.9.0"
vico = "3.3.1"
documentfile = "1.0.1"
# Final standalone release — icons left the Compose BOM; pinned explicitly.
iconsExtended = "1.7.8"
anthropicJava = "2.59.0"
okhttp = "4.12.0"
glance = "1.2.0"
# v1.2 Notlar preview — maintained Compose markdown renderer (verified on Maven Central 2026-08-30).
markdownRenderer = "0.45.0"
# v2.0 multiplatform — every pin below verified against Maven Central / Google Maven metadata on 2026-09-01.
composeMultiplatform = "1.12.0"      # built on Jetpack Compose 1.12.0 == our BOM 2026.08.00
jbMaterial3 = "1.9.0"                # JetBrains material3 line is decoupled from CMP; last stable
jbAdaptive = "1.2.0"                 # org.jetbrains.compose.material3.adaptive, last stable
jbIcons = "1.7.3"                    # frozen multiplatform icons artifact
jbLifecycle = "2.11.0"               # == androidx lifecycle 2.11.0 already resolved on Android
jbNavigation = "2.9.2"               # last stable multiplatform navigation-compose
koin = "4.2.2"
filekit = "0.15.0"
sqlite = "2.6.2"                     # matches Room 2.8.4's androidx.sqlite dependency
okio = "3.18.1"
coroutines = "1.11.0"

